name: Publish signed catalog

on:
  push:
    branches:
      - main
    paths:
      - "plugins/**"
      - "revocations.toml"
      - "scripts/**"
      - "keys/catalog-v1.pub"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  attestations: read

concurrency:
  group: publish-catalog-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out registry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install signing dependency
        run: python -m pip install cryptography==49.0.0
      - name: Generate signed catalog
        env:
          GH_TOKEN: ${{ github.token }}
          MARKETPLACE_SIGNING_KEY: ${{ secrets.MARKETPLACE_SIGNING_KEY }}
        run: python scripts/generate_catalog.py --root . --output dist
      - name: Create catalog release when missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view catalog-v1 >/dev/null 2>&1; then
            gh release create catalog-v1 --title "WinIsland Plugin Catalog v1" --notes "Signed marketplace catalog. Assets are managed by automation." --latest=false
          fi
      - name: Publish catalog assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload catalog-v1 dist/** --clobber
