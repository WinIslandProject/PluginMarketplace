name: Build and release WinIsland plugin

on:
  workflow_call:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Check out plugin source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: plugin
      - name: Check out trusted marketplace tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: WinIslandProject/PluginMarketplace
          ref: main
          path: marketplace
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Select stable Rust
        shell: pwsh
        run: rustup default stable
      - name: Check plugin
        working-directory: plugin
        run: cargo check --all-targets --locked
      - name: Lint plugin
        working-directory: plugin
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Verify formatting
        working-directory: plugin
        run: cargo fmt --all -- --check
      - name: Build package
        working-directory: plugin
        run: cargo run --locked --example pack
      - name: Prepare release asset
        id: package
        shell: pwsh
        run: |
          $path = python marketplace/scripts/prepare_plugin_release.py --root plugin --output dist
          "path=$path" >> $env:GITHUB_OUTPUT
      - name: Attest release asset
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: ${{ steps.package.outputs.path }}
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME "${{ steps.package.outputs.path }}" `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --generate-notes
